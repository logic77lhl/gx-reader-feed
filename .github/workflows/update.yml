name: update-x-feed

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "逗号分隔的账号；留空使用默认列表"
        required: false
        default: ""
      queries:
        description: "逗号分隔的搜索词；留空使用默认列表"
        required: false
        default: ""
      top:
        description: "是否抓取 Top 热门结果"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-x-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_ACCOUNTS: ${{ inputs.accounts }}
      RELAY_QUERIES: ${{ inputs.queries }}
      RELAY_TOP: ${{ inputs.top }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch public X timelines and search
        run: python relay.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json search.json
          git diff --cached --quiet && exit 0
          git commit -m "update x feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
